name: Deploy POS0210 Web Manager

on:
  push:
    branches: [builder/web-manager-readonly]
    paths:
      - 'web-manager/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.firebaserc'
      - '.github/workflows/deploy-web-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firebase Hosting and Rules
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS0210 }}'
          channelId: live
          projectId: pos0210-17ce4
