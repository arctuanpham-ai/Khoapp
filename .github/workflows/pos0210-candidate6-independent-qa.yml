name: POS0210 Candidate6 Independent QA

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-candidate6-independent-qa.yml'
  workflow_dispatch:

jobs:
  unit-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32dfc4144c1028d3a3445122742908c28fbabdf2
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accounting timer unit tests
        run: |
          gradle -p candidate/POS0210 --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.MonthlyAccountingTest --tests vn.ecohome.pos0210.TableServiceTimerTest --stacktrace
      - name: Candidate6 static assertions
        run: |
          grep -q 'versionCode = 67' candidate/POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate6"' candidate/POS0210/app/build.gradle.kts
          grep -q 'version=13' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'heightIn(min=spec.minCardHeight)' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/TableCard.kt
          grep -q 'tableCount<=16' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/TableCard.kt
          grep -q 'tableCount>16' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/TableCard.kt
          grep -q 'twentyFourTablesScrollWithoutClipping' candidate/POS0210/app/src/androidTest/java/vn/ecohome/pos0210/TableCardResponsiveTest.kt
          ! grep -R 'img.vietqr.io' candidate/POS0210/app/src/main || exit 1
          grep -q 'VietQrOffline.bitmap' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt

  responsive-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32dfc4144c1028d3a3445122742908c28fbabdf2
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app and UI tests
        run: gradle -p candidate/POS0210 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run 4/12/16/24-table clipping tests on Android 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle -p candidate/POS0210 --no-daemon :app:connectedDebugAndroidTest --stacktrace

  upgrade-data-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
          - api: 35
            target: aosp_atd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ae84b456b25aeb67ea51a2f3b3e8e6dc1e8c105
          path: alpha50
      - uses: actions/checkout@v4
        with:
          ref: 32dfc4144c1028d3a3445122742908c28fbabdf2
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build exact APKs and UI test APK
        run: |
          gradle -p alpha50/POS0210 --no-daemon :app:assembleDebug --stacktrace
          gradle -p candidate/POS0210 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          cp alpha50/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha50.apk
          cp candidate/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha51.apk
          cp candidate/POS0210/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/alpha51-androidTest.apk
          test -s /tmp/alpha51-androidTest.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha50.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha51.apk
      - name: Patch expected candidate version only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/.github/scripts/pos0210-upgrade-gate.sh')
          s=p.read_text()
          import re
          s=re.sub(r'versionName=1\.0\.0-alpha52-candidate\d+\|versionCode=\d+', 'versionName=1.0.0-alpha52-candidate6|versionCode=67', s)
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - run: sudo apt-get update -qq && sudo apt-get install -y sqlite3
      - name: In-place upgrade/data survival
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash candidate/.github/scripts/pos0210-upgrade-gate.sh
