name: POS0210 finance semantics candidate17

on:
  push:
    branches:
      - builder/finance-report-semantics-fix
    paths:
      - .github/workflows/pos0210-finance-semantics-candidate17.yml

permissions:
  contents: write

jobs:
  build_candidate17:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact candidate16-derived branch
        uses: actions/checkout@v4
        with:
          ref: builder/finance-report-semantics-fix
          fetch-depth: 5

      - name: Verify baseline identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 77' POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate16"' POS0210/app/build.gradle.kts
          grep -q 'version=19' POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply only finance UI/report fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pos0210_finance_semantics_fix.py
          grep -q 'versionCode = 78' POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate17"' POS0210/app/build.gradle.kts
          grep -q 'Người nhận lương / nhân sự' POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          grep -q 'Chi phí theo nhóm tài chính' POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt

      - name: Strict scope guard
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          changed=$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^POS0210/(\.gradle/|app/build/)' | sort -u)
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^POS0210/app/(build.gradle.kts|src/main/java/vn/ecohome/pos0210/MainActivity.kt)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected source files changed; refusing build:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Targeted semantics tests
        shell: bash
        working-directory: POS0210
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.FinanceSemanticsTest --stacktrace

      - name: Standard APK gates
        shell: bash
        working-directory: POS0210
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify APK identity signature and SHA
        shell: bash
        working-directory: POS0210
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          BADGING=$($AAPT dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='vn.ecohome.pos0210'"
          echo "$BADGING" | grep -q "versionCode='78'"
          echo "$BADGING" | grep -q "versionName='1.0.0-alpha52-candidate17'"
          $APKSIGNER verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/POS0210_v1.0.0-alpha52-candidate17.apk
          sha256sum dist/POS0210_v1.0.0-alpha52-candidate17.apk | tee dist/POS0210_v1.0.0-alpha52-candidate17.apk.sha256

      - name: Commit validated source patch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'POS0210 Builder'
          git config user.email 'actions@github.com'
          git add POS0210/app/build.gradle.kts POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          git diff --cached --check
          git commit -m 'fix(pos0210): separate payer from payroll and financial reporting [skip ci]'
          git push origin HEAD:builder/finance-report-semantics-fix

      - name: Upload candidate17 APK
        uses: actions/upload-artifact@v4
        with:
          name: POS0210-v1.0.0-alpha52-candidate17-vc78-finance-semantics
          path: |
            POS0210/dist/POS0210_v1.0.0-alpha52-candidate17.apk
            POS0210/dist/POS0210_v1.0.0-alpha52-candidate17.apk.sha256
          if-no-files-found: error
          retention-days: 30
