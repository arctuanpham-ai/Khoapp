name: POS0210 Upgrade Data Survival Gate

on:
  push:
    branches: [ pos0210-v1-rebuild, builder/issue-3-offline-qr ]
    paths:
      - '.github/workflows/pos0210-upgrade-gate.yml'
      - '.github/scripts/pos0210-upgrade-gate.sh'
      - 'POS0210/**'
  workflow_dispatch:

concurrency:
  group: pos0210-upgrade-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
          - api: 35
            target: aosp_atd
    steps:
      - name: Checkout alpha50 source
        uses: actions/checkout@v4
        with:
          ref: 9ae84b456b25aeb67ea51a2f3b3e8e6dc1e8c105
          path: alpha50

      - name: Checkout Builder candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: alpha51

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build alpha50 and alpha51
        run: |
          (cd alpha50/POS0210 && gradle --no-daemon :app:assembleDebug --stacktrace)
          (cd alpha51/POS0210 && gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace)
          cp alpha50/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha50.apk
          cp alpha51/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha51.apk
          cp alpha51/POS0210/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/alpha51-androidTest.apk
          test -s /tmp/alpha50.apk
          test -s /tmp/alpha51.apk
          test -s /tmp/alpha51-androidTest.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha50.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha51.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install sqlite3 host tool
        run: sudo apt-get update -qq && sudo apt-get install -y sqlite3

      - name: Run real Android in-place upgrade gate
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash alpha51/.github/scripts/pos0210-upgrade-gate.sh

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha50-to-builder-candidate-upgrade-evidence-api${{ matrix.api }}-${{ github.sha }}
          path: |
            /tmp/install50.txt
            /tmp/install51.txt
            /tmp/pre_integrity.txt
            /tmp/pre_integrity_after_markers.txt
            /tmp/post_integrity.txt
            /tmp/before.json
            /tmp/after.json
            /tmp/window.xml
            /tmp/logcat.txt
            /tmp/install_android_test.txt
            /tmp/table_card_tests.txt
          if-no-files-found: warn
          retention-days: 30
