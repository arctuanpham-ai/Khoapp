name: POS0210 Candidate2 Exact Upgrade QA

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-candidate2-upgrade-qa.yml'
  workflow_dispatch:

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout alpha50 source
        uses: actions/checkout@v4
        with:
          ref: 9ae84b456b25aeb67ea51a2f3b3e8e6dc1e8c105
          path: alpha50

      - name: Checkout exact candidate2 source
        uses: actions/checkout@v4
        with:
          ref: fe414dd66a12e97b79a0646caa773747b3e4f655
          path: candidate

      - name: Fix QA harness only
        run: |
          sed -i 's/^    if uv != 12:/if uv != 12:/' candidate/.github/scripts/pos0210-upgrade-gate.sh
          grep -n "user_version expected 12" candidate/.github/scripts/pos0210-upgrade-gate.sh

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build exact candidate and alpha50
        run: |
          (cd alpha50/POS0210 && gradle --no-daemon :app:assembleDebug --stacktrace)
          (cd candidate/POS0210 && gradle --no-daemon :app:assembleDebug --stacktrace)
          cp alpha50/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha50.apk
          cp candidate/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha51.apk
          test -s /tmp/alpha50.apk && test -s /tmp/alpha51.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha50.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha51.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install sqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y sqlite3

      - name: Run exact in-place upgrade and data survival gate
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash candidate/.github/scripts/pos0210-upgrade-gate.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate2-exact-upgrade-evidence
          path: |
            /tmp/install50.txt
            /tmp/install51.txt
            /tmp/pre_integrity.txt
            /tmp/pre_integrity_after_markers.txt
            /tmp/post_integrity.txt
            /tmp/before.json
            /tmp/after.json
            /tmp/window.xml
            /tmp/logcat.txt
          if-no-files-found: warn
          retention-days: 30
