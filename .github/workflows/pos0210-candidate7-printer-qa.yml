name: POS0210 Candidate7 Printer Independent QA

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-candidate7-printer-qa.yml'
  workflow_dispatch:

jobs:
  printer-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7243efb07ffe21f84ae372591019fc94f6f399aa
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify candidate identity and printer safeguards
        run: |
          grep -q 'versionCode = 68' candidate/POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate7"' candidate/POS0210/app/build.gradle.kts
          grep -q 'MAX_JOB_BYTES=768\*1024' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/printing/BluetoothPrinter.kt
          grep -q 'rasterStripeHeight:Int=96' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/printing/PrinterProfile.kt
          grep -q 'MM58=PrinterProfile(PaperSize.MM58,58,384,32)' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/printing/PrinterProfile.kt
          grep -q 'MM80=PrinterProfile(PaperSize.MM80,80,576,48)' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/printing/PrinterProfile.kt
          grep -q 'raster.forEach{command->out.write(command)}' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/printing/BluetoothPrinter.kt
      - name: Build app and printer instrumentation APK
        run: gradle -p candidate/POS0210 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

  printer-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
          - api: 35
            target: aosp_atd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7243efb07ffe21f84ae372591019fc94f6f399aa
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build printer tests
        run: gradle -p candidate/POS0210 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run printer pipeline tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle -p candidate/POS0210 --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=vn.ecohome.pos0210.PrinterPipelineInstrumentedTest --stacktrace
