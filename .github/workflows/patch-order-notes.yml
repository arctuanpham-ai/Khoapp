name: Patch POS0210 order notes

on:
  push:
    branches: [ pos0210-v1-rebuild ]
    paths:
      - '.github/workflows/patch-order-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos0210-v1-rebuild
      - name: Apply patch
        run: echo ' ...TRUNCATED...==' | base64 -d | python3
      - name: Commit patch
        run: |
          git config user.name 'pos0210-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add POS0210/app/src/main/java/vn/ecohome/pos0210/PosViewModel.kt POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt POS0210/app/src/main/java/vn/ecohome/pos0210/printing/BluetoothPrinter.kt POS0210/app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m 'Add per-line order notes for kitchen'
            git push origin HEAD:pos0210-v1-rebuild
          fi
