name: Patch POS0210 order notes

on:
  push:
    branches: [ pos0210-v1-rebuild ]
    paths:
      - '.github/workflows/patch-order-notes.yml'
      - '.github/scripts/patch_order_notes.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos0210-v1-rebuild

      - name: Apply source patch
        run: python3 .github/scripts/patch_order_notes.py

      - name: Commit source patch
        run: |
          git config user.name "pos0210-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add POS0210/app/src/main/java/vn/ecohome/pos0210/PosViewModel.kt \
                  POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt \
                  POS0210/app/src/main/java/vn/ecohome/pos0210/printing/BluetoothPrinter.kt \
                  POS0210/app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Add per-line order notes for kitchen"
            git push origin HEAD:pos0210-v1-rebuild
          fi
