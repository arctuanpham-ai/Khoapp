name: POS0210 Candidate4 Independent QA

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-candidate4-independent-qa.yml'
  workflow_dispatch:

jobs:
  timer-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4249c478cbd5d922402111e3e72583ad11ec0b7e
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run candidate timer unit tests
        run: gradle -p candidate/POS0210 --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.TableServiceTimerTest --stacktrace
      - name: Timer static acceptance assertions
        run: |
          grep -q "firstOrderAt" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q "lastOrderSentAt" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q "status NOT IN ('DRAFT','CANCELLED')" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q "WHERE s.status='OPEN'" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q "System.currentTimeMillis()" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          grep -q "60_000L" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          ! grep -R "UPDATE .*firstOrderAt\|UPDATE .*lastOrderSentAt\|SET firstOrderAt\|SET lastOrderSentAt" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210 || exit 1
          grep -q 'versionCode = 65' candidate/POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate4"' candidate/POS0210/app/build.gradle.kts
          grep -q 'version=12' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt

  upgrade-data-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
          - api: 35
            target: aosp_atd
    steps:
      - name: Checkout alpha50 source
        uses: actions/checkout@v4
        with:
          ref: 9ae84b456b25aeb67ea51a2f3b3e8e6dc1e8c105
          path: alpha50
      - name: Checkout exact candidate4
        uses: actions/checkout@v4
        with:
          ref: 4249c478cbd5d922402111e3e72583ad11ec0b7e
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build exact candidate4 and alpha50
        run: |
          gradle -p alpha50/POS0210 --no-daemon :app:assembleDebug --stacktrace
          gradle -p candidate/POS0210 --no-daemon :app:assembleDebug --stacktrace
          cp alpha50/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha50.apk
          cp candidate/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha51.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha50.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha51.apk
      - name: Patch QA harness expected version only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/.github/scripts/pos0210-upgrade-gate.sh')
          s=p.read_text()
          s=s.replace("versionName=1.0.0-alpha52-candidate3|versionCode=64", "versionName=1.0.0-alpha52-candidate4|versionCode=65")
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - run: sudo apt-get update -qq && sudo apt-get install -y sqlite3
      - name: Exact candidate4 in-place upgrade/data survival
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash candidate/.github/scripts/pos0210-upgrade-gate.sh

  offline-qr-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4249c478cbd5d922402111e3e72583ad11ec0b7e
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: QR static regression
        run: |
          ! grep -R "img.vietqr.io" candidate/POS0210/app/src/main || exit 1
          grep -q "VietQrOffline.bitmap" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          grep -q "VietQrOffline.bitmap" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/PosViewModel.kt
      - name: Build candidate4
        run: gradle -p candidate/POS0210 --no-daemon :app:assembleDebug --stacktrace
