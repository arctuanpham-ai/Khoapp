name: Patch final pre-RC hardening

on:
  push:
    branches: [ pos0210-v1-rebuild ]
    paths:
      - '.github/workflows/patch-final-hardening.yml'
      - '.github/scripts/patch_final_hardening.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_final_hardening.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosRepository.kt POS0210/app/src/main/java/vn/ecohome/pos0210/data/DatabaseHealth.kt POS0210/app/src/main/java/vn/ecohome/pos0210/data/DataBackup.kt POS0210/app/src/main/java/vn/ecohome/pos0210/PosViewModel.kt POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          git diff --cached --quiet || git commit -m "Final pre-RC hardening for order payment print and restore"
          git push
