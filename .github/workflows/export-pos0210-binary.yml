name: Export POS0210 legacy binary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-pos0210-binary.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export legacy binaries as base64 text
        run: |
          git show 4cceec8e813d58e92840781d81e8b3cafec32faa:POS0210/app/pos0210-debug.keystore | base64 -w0 > pos0210-debug.keystore.b64
          git show 4cceec8e813d58e92840781d81e8b3cafec32faa:POS0210/app/src/main/res/drawable-nodpi/ic_launcher_foreground_0210.png | base64 -w0 > ic_launcher_foreground_0210.png.b64
      - name: Commit temporary export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pos0210-debug.keystore.b64 ic_launcher_foreground_0210.png.b64
          git commit -m "temp: export POS0210 legacy binaries" || exit 0
          git push
