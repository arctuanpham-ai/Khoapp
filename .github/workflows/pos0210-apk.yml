name: Build POS 0210 APK
on:
  push:
    branches: [pos0210-dev, pos0210-v1-rebuild]
    paths: ['POS0210/**', '.github/workflows/pos0210-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build APK
        working-directory: POS0210
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: POS0210-V1-debug-apk
          path: POS0210/app/build/outputs/apk/debug/app-debug.apk