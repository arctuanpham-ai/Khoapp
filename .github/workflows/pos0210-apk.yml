name: Build POS0210 APK

on:
  push:
    branches: [ pos0210-v1-rebuild, builder/issue-3-offline-qr, sol/web-manager-finance-v1 ]
    paths:
      - 'POS0210/**'
      - '.github/workflows/pos0210-apk.yml'
  workflow_dispatch:

concurrency:
  group: pos0210-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: POS0210

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set rollout version
        if: github.ref == 'refs/heads/sol/web-manager-finance-v1'
        shell: bash
        run: |
          sed -i 's/versionCode = 86/versionCode = 87/' app/build.gradle.kts
          sed -i 's/versionName = "1.0.0-alpha56-candidate25"/versionName = "1.0.0-alpha57-candidate26"/' app/build.gradle.kts

      - name: Test and build full installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify package version and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING=$($AAPT dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='vn.ecohome.pos0210'"
          echo "$BADGING" | grep -q "versionCode='${{ steps.app_version.outputs.code }}'"
          echo "$BADGING" | grep -q "versionName='${{ steps.app_version.outputs.name }}'"
          $APKSIGNER verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Prepare distributable APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/POS0210_v${{ steps.app_version.outputs.name }}.apk"
          sha256sum "dist/POS0210_v${{ steps.app_version.outputs.name }}.apk" > "dist/POS0210_v${{ steps.app_version.outputs.name }}.apk.sha256"

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: POS0210-v${{ steps.app_version.outputs.name }}-vc${{ steps.app_version.outputs.code }}-${{ github.sha }}
          path: |
            POS0210/dist/POS0210_v${{ steps.app_version.outputs.name }}.apk
            POS0210/dist/POS0210_v${{ steps.app_version.outputs.name }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
