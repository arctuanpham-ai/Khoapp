name: POS0210 Independent Offline QR Gate

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-offline-qr-qa.yml'
  workflow_dispatch:

jobs:
  offline-qr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Builder candidate
        uses: actions/checkout@v4
        with:
          ref: bc82a12076894fe0ee950c2b76a57c7754847a86
          path: candidate

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject QA-only instrumentation test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/POS0210/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('targetSdk = 35', 'targetSdk = 35\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"')
          s=s.replace('testImplementation("junit:junit:4.13.2")', 'testImplementation("junit:junit:4.13.2")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")\n    androidTestImplementation("androidx.test:runner:1.6.2")')
          p.write_text(s)
          PY
          mkdir -p candidate/POS0210/app/src/androidTest/java/vn/ecohome/pos0210/payment
          cat > candidate/POS0210/app/src/androidTest/java/vn/ecohome/pos0210/payment/VietQrOfflineInstrumentedTest.kt <<'EOF'
          package vn.ecohome.pos0210.payment

          import androidx.test.ext.junit.runners.AndroidJUnit4
          import org.junit.Assert.*
          import org.junit.Test
          import org.junit.runner.RunWith
          import java.security.MessageDigest

          @RunWith(AndroidJUnit4::class)
          class VietQrOfflineInstrumentedTest {
              @Test fun qrPayloadAndBitmapWorkWithNetworkDisabled() {
                  val payload1 = VietQrPayload.build("MB", "123456789", "0210", 121500, "0210 BAN 02").getOrThrow()
                  val bitmap1 = VietQrOffline.bitmap("MB", "123456789", "0210", 121500, "0210 BAN 02", 384).getOrThrow()
                  val payload2 = VietQrPayload.build("MB", "123456789", "0210", 121500, "0210 BAN 02").getOrThrow()
                  val bitmap2 = VietQrOffline.bitmap("MB", "123456789", "0210", 121500, "0210 BAN 02", 384).getOrThrow()

                  assertEquals(payload1, payload2)
                  assertTrue(payload1.startsWith("00020101021238"))
                  assertTrue(payload1.contains("970422"))
                  assertTrue(payload1.contains("123456789"))
                  assertTrue(payload1.contains("121500"))
                  assertEquals(384, bitmap1.width)
                  assertEquals(384, bitmap1.height)
                  assertEquals(bitmap1.sameAs(bitmap2), true)

                  var black = 0
                  var white = 0
                  for (y in 0 until bitmap1.height step 8) for (x in 0 until bitmap1.width step 8) {
                      if ((bitmap1.getPixel(x,y) and 0x00FFFFFF) == 0) black++ else white++
                  }
                  assertTrue("QR must contain black modules", black > 0)
                  assertTrue("QR must contain white modules", white > 0)

                  val digest = MessageDigest.getInstance("SHA-256").digest(payload1.toByteArray()).joinToString("") { "%02x".format(it) }
                  println("QA_OFFLINE_QR_PAYLOAD_SHA256=$digest")
              }
          }
          EOF

      - name: Build candidate and QA test APKs
        run: gradle -p candidate/POS0210 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run P0 QR test with network disabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell cmd connectivity airplane-mode enable || true
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            sleep 4
            echo '=== connectivity while QR test runs ==='
            adb shell cmd connectivity airplane-mode || true
            adb shell dumpsys wifi | grep -E 'Wi-Fi is|mWifiEnabled|enabled=' | head -20 || true
            if adb shell dumpsys connectivity | grep -q 'WIFI CONNECTED'; then
              echo 'Wi-Fi still connected; force-disable again'
              adb shell svc wifi disable || true
              sleep 3
            fi
            gradle -p candidate/POS0210 --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Source/API regression assertions
        if: always()
        run: |
          ! grep -R "img.vietqr.io" candidate/POS0210/app/src/main || (echo 'Remote VietQR dependency remains' && exit 1)
          grep -q "OfflineVietQrImage" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          grep -q "VietQrOffline.bitmap" candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          grep -q 'versionCode = 62' candidate/POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate1"' candidate/POS0210/app/build.gradle.kts
