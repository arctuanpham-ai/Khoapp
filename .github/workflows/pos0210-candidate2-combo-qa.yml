name: POS0210 Candidate2 Combo Regression QA

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-candidate2-combo-qa.yml'
  workflow_dispatch:

jobs:
  combo-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Builder candidate2
        uses: actions/checkout@v4
        with:
          ref: fe414dd66a12e97b79a0646caa773747b3e4f655
          path: candidate

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject QA-only combo instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/POS0210/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('targetSdk = 35', 'targetSdk = 35\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"')
          s=s.replace('testImplementation("junit:junit:4.13.2")', 'testImplementation("junit:junit:4.13.2")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")\n    androidTestImplementation("androidx.test:runner:1.6.2")')
          p.write_text(s)
          PY
          mkdir -p candidate/POS0210/app/src/androidTest/java/vn/ecohome/pos0210/data
          cat > candidate/POS0210/app/src/androidTest/java/vn/ecohome/pos0210/data/ComboPersistenceInstrumentedTest.kt <<'EOF'
          package vn.ecohome.pos0210.data

          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.*
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class ComboPersistenceInstrumentedTest {
              @Test fun comboCreateEditReplaceItemsDeactivateAndReopenPersist() = runBlocking {
                  val context = InstrumentationRegistry.getInstrumentation().targetContext
                  PosDatabase.closeForRestore()
                  context.deleteDatabase("pos0210.db")
                  var db = PosDatabase.get(context)
                  var dao = db.dao()

                  dao.saveCombo(ComboEntity("qa_combo", "Combo cũ", 55000, "content://qa/old", 7, true, "Mô tả cũ"))
                  dao.saveComboItem(ComboItemEntity("qa_ci1", "qa_combo", "m1", 1))
                  dao.saveComboItem(ComboItemEntity("qa_ci2", "qa_combo", "m2", 2))

                  var combo = dao.allCombosSnapshot().single { it.id == "qa_combo" }
                  assertEquals("Combo cũ", combo.name)
                  assertEquals(55000L, combo.price)
                  assertEquals("Mô tả cũ", combo.description)
                  assertEquals("content://qa/old", combo.imageUri)
                  assertTrue(combo.active)
                  var items = dao.comboItems("qa_combo").first().sortedBy { it.id }
                  assertEquals(2, items.size)
                  assertEquals(1, items[0].qty)
                  assertEquals(2, items[1].qty)

                  dao.saveCombo(ComboEntity("qa_combo", "Combo mới", 69000, "content://qa/new", 3, true, "Mô tả mới"))
                  dao.deleteComboItems("qa_combo")
                  dao.saveComboItem(ComboItemEntity("qa_ci3", "qa_combo", "m3", 3))
                  dao.setComboActive("qa_combo", false)

                  combo = dao.allCombosSnapshot().single { it.id == "qa_combo" }
                  assertEquals("Combo mới", combo.name)
                  assertEquals(69000L, combo.price)
                  assertEquals("Mô tả mới", combo.description)
                  assertEquals("content://qa/new", combo.imageUri)
                  assertFalse(combo.active)
                  items = dao.comboItems("qa_combo").first()
                  assertEquals(1, items.size)
                  assertEquals("m3", items.single().menuItemId)
                  assertEquals(3, items.single().qty)

                  PosDatabase.closeForRestore()
                  db = PosDatabase.get(context)
                  dao = db.dao()
                  combo = dao.allCombosSnapshot().single { it.id == "qa_combo" }
                  items = dao.comboItems("qa_combo").first()
                  assertEquals("Combo mới", combo.name)
                  assertEquals(69000L, combo.price)
                  assertEquals("Mô tả mới", combo.description)
                  assertEquals("content://qa/new", combo.imageUri)
                  assertFalse(combo.active)
                  assertEquals(1, items.size)
                  assertEquals("m3", items.single().menuItemId)
                  assertEquals(3, items.single().qty)
                  println("QA_COMBO_PERSISTENCE_PASS")
              }
          }
          EOF

      - name: Build candidate and combo QA APKs
        run: gradle -p candidate/POS0210 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run combo persistence regression
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle -p candidate/POS0210 --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Candidate2 combo source assertions
        if: always()
        run: |
          grep -q 'description:String=""' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/Entities.kt
          grep -q 'saveCombo(v:ComboEntity)' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q 'deleteComboItems(comboId:String)' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q 'setComboActive(id:String,active:Boolean)' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q 'MIGRATION_11_12' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
