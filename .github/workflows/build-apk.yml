name: Build ECOHOME Viewer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch v0.1.6 interaction and DIM overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/vn/ecohome/viewer/MainActivity.kt')
          s = p.read_text()

          # Extra state for native gesture handoff + visible DIM markers.
          anchor = '    private var sourceMaxExtentMeters = 1.0\n'
          extra = '''    private var sourceMaxExtentMeters = 1.0
    private var touchDownX = 0f
    private var touchDownY = 0f
    private var longPressArmed = false
    private var dimScreen1: Pair<Float, Float>? = null
    private val dimMarkerViews = mutableListOf<View>()
'''
          if anchor in s:
              s = s.replace(anchor, extra, 1)

          # Camera strip: make Zoom Extents explicit.
          s = s.replace('Triple("⌗", "Fit") { fitModel() }', 'Triple("⛶", "Extents") { fitModel() }', 1)

          # Replace touch controller. Normal viewing is handed directly to Filament ModelViewer,
          # which recognizes 1-finger orbit, 2-finger pan and pinch zoom simultaneously.
          pattern = r'    private fun installSmartTouchController\(\) \{.*?\n    \}\n\n    private fun showMagnifier'
          replacement = '''    private fun installSmartTouchController() {
        surfaceView.setOnTouchListener { _, event ->
            if (!dimMode) {
                // Native ModelViewer gesture recognizer: 1 finger orbit, 2 fingers pan, pinch zoom.
                return@setOnTouchListener modelViewer.onTouch(surfaceView, event)
            }

            when (event.actionMasked) {
                MotionEvent.ACTION_DOWN -> {
                    touchDownX = event.x; touchDownY = event.y
                    holdX = event.x; holdY = event.y
                    longPressArmed = true
                    surfaceView.postDelayed({
                        if (dimMode && longPressArmed && !precisionHold) {
                            precisionHold = true
                            showMagnifier(holdX, holdY)
                            setStatus("DIM • rê ngón tay để căn điểm • nhả để chốt")
                        }
                    }, 360)
                    true
                }
                MotionEvent.ACTION_MOVE -> {
                    holdX = event.x; holdY = event.y
                    val dx = holdX - touchDownX; val dy = holdY - touchDownY
                    if (!precisionHold && dx * dx + dy * dy > dp(10) * dp(10)) longPressArmed = false
                    if (precisionHold) showMagnifier(holdX, holdY)
                    true
                }
                MotionEvent.ACTION_UP -> {
                    longPressArmed = false
                    if (precisionHold) {
                        hideMagnifier(); precisionHold = false
                        pickDimPoint(holdX, holdY)
                    } else {
                        setStatus("DIM • ấn giữ trên bề mặt để chọn điểm")
                    }
                    true
                }
                MotionEvent.ACTION_CANCEL -> {
                    longPressArmed = false; precisionHold = false; hideMagnifier(); true
                }
                else -> true
            }
        }
    }

    private fun showMagnifier'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'controller patch count={n}')

          # Insert visual marker + line helpers after magnifier dismiss.
          anchor2 = '    private fun hideMagnifier() { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) runCatching { magnifier?.dismiss() } }\n'
          helper = '''    private fun hideMagnifier() { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) runCatching { magnifier?.dismiss() } }

    private fun clearDimOverlay() {
        dimMarkerViews.forEach { runCatching { root.removeView(it) } }
        dimMarkerViews.clear()
        dimScreen1 = null
    }

    private fun showDimMarker(x: Float, y: Float, label: String) {
        val marker = TextView(this).apply {
            text = label
            textSize = 12f
            gravity = Gravity.CENTER
            setTextColor(Color.WHITE)
            typeface = Typeface.DEFAULT_BOLD
            background = solid(green, 18f, Color.WHITE)
            elevation = dp(8).toFloat()
        }
        val size = dp(34)
        root.addView(marker, FrameLayout.LayoutParams(size, size).apply {
            leftMargin = (x - size / 2f).roundToInt()
            topMargin = (y - size / 2f).roundToInt()
        })
        dimMarkerViews.add(marker)
    }

    private fun showDimLine(x1: Float, y1: Float, x2: Float, y2: Float) {
        val dx = x2 - x1; val dy = y2 - y1
        val len = sqrt(dx * dx + dy * dy).roundToInt().coerceAtLeast(1)
        val line = View(this).apply {
            setBackgroundColor(green)
            pivotX = 0f; pivotY = dp(1).toFloat()
            rotation = Math.toDegrees(Math.atan2(dy.toDouble(), dx.toDouble())).toFloat()
            elevation = dp(6).toFloat()
        }
        root.addView(line, FrameLayout.LayoutParams(len, dp(2)).apply {
            leftMargin = x1.roundToInt(); topMargin = y1.roundToInt()
        })
        dimMarkerViews.add(line)
    }
'''
          if anchor2 not in s:
              raise SystemExit('hideMagnifier anchor missing')
          s = s.replace(anchor2, helper, 1)

          # Make DIM pick visible.
          old1 = '''            if (dimPoint1 == null) {
                dimPoint1 = world; dimPoint2 = null
                setStatus("DIM • Điểm 1 ✓ • ấn giữ để chọn điểm 2")
            } else {
                dimPoint2 = world
                val d = distance(dimPoint1!!, dimPoint2!!) * (sourceMaxExtentMeters / 2.0) * 1000.0
                setStatus("DIM • ${d.roundToInt()} mm")
                Toast.makeText(this, "Khoảng cách: ${d.roundToInt()} mm", Toast.LENGTH_LONG).show()
            }'''
          new1 = '''            if (dimPoint1 == null) {
                clearDimOverlay()
                dimPoint1 = world; dimPoint2 = null
                dimScreen1 = x to y
                showDimMarker(x, y, "1")
                setStatus("DIM • Điểm 1 ✓ • ấn giữ để chọn điểm 2")
            } else {
                dimPoint2 = world
                val d = distance(dimPoint1!!, dimPoint2!!) * (sourceMaxExtentMeters / 2.0) * 1000.0
                val p1 = dimScreen1
                if (p1 != null) showDimLine(p1.first, p1.second, x, y)
                showDimMarker(x, y, "2")
                setStatus("DIM • ${d.roundToInt()} mm")
                Toast.makeText(this, "Khoảng cách: ${d.roundToInt()} mm", Toast.LENGTH_LONG).show()
            }'''
          if old1 not in s:
              raise SystemExit('DIM branch anchor missing')
          s = s.replace(old1, new1, 1)

          # Clear visible overlay whenever starting/clearing DIM or resetting/loading.
          s = s.replace('0 -> { dimMode = true; dimPoint1 = null; dimPoint2 = null; setStatus("DIM • ấn giữ điểm 1 để bật kính lúp") }',
                        '0 -> { dimMode = true; dimPoint1 = null; dimPoint2 = null; clearDimOverlay(); setStatus("DIM • ấn giữ điểm 1 để bật kính lúp") }')
          s = s.replace('1 -> { dimMode = false; dimPoint1 = null; dimPoint2 = null; setStatus("DIM • Đã xóa") }',
                        '1 -> { dimMode = false; dimPoint1 = null; dimPoint2 = null; clearDimOverlay(); setStatus("DIM • Đã xóa") }')
          s = s.replace('private fun resetView() { dimMode = false; dimPoint1 = null; dimPoint2 = null; fitModel();',
                        'private fun resetView() { dimMode = false; dimPoint1 = null; dimPoint2 = null; clearDimOverlay(); fitModel();')
          s = s.replace('dimMode = false; dimPoint1 = null; dimPoint2 = null\n            surfaceView.postDelayed',
                        'dimMode = false; dimPoint1 = null; dimPoint2 = null; clearDimOverlay()\n            surfaceView.postDelayed')

          s = s.replace('ECOHOME Viewer v0.1.5', 'ECOHOME Viewer v0.1.6')
          p.write_text(s)
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create temporary release signing key
        shell: bash
        run: |
          PASS=$(openssl rand -hex 16)
          KEYSTORE="$GITHUB_WORKSPACE/ecohome-ci-release.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias ecohome -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ECOHOME Viewer, OU=ECOHOME, O=ECOHOME, C=VN"
          echo "ECOHOME_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ECOHOME_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ECOHOME_KEY_ALIAS=ecohome" >> "$GITHUB_ENV"
          echo "ECOHOME_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Validate APK package, SDK, ABI and signature
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:"
          cp "$APK" ECOHOME_Viewer_v0.1.6_ARM64.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECOHOME-Viewer-v0.1.6-ARM64
          path: ECOHOME_Viewer_v0.1.6_ARM64.apk
          if-no-files-found: error

      - name: Publish GitHub Release v0.1.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.6 >/dev/null 2>&1; then
            gh release upload v0.1.6 ECOHOME_Viewer_v0.1.6_ARM64.apk --clobber
          else
            gh release create v0.1.6 ECOHOME_Viewer_v0.1.6_ARM64.apk --title "ECOHOME Viewer v0.1.6" --notes "Camera gestures are handed directly to Filament ModelViewer for automatic one-finger Orbit, two-finger Pan and pinch Zoom. Fit is exposed as Zoom Extents. DIM now shows visible point 1/2 markers and a screen-space measurement line, with long-press magnifier precision picking. UI safe-area and SketchUp metadata Tags behavior are retained."
          fi
