name: Build ECOHOME Viewer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply v0.1.7 source patch
        run: python3 scripts/patch_v017.py
      - name: Apply v0.1.8 source patch
        run: python3 scripts/patch_v018.py
      - name: Apply v0.1.9 source patch
        run: python3 scripts/patch_v019.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create temporary release signing key
        shell: bash
        run: |
          PASS=$(openssl rand -hex 16)
          KEYSTORE="$GITHUB_WORKSPACE/ecohome-ci-release.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias ecohome -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ECOHOME Viewer, OU=ECOHOME, O=ECOHOME, C=VN"
          echo "ECOHOME_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ECOHOME_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "ECOHOME_KEY_ALIAS=ecohome" >> "$GITHUB_ENV"
          echo "ECOHOME_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Validate APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" ECOHOME_Viewer_v0.1.9_ARM64.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECOHOME-Viewer-v0.1.9-ARM64
          path: ECOHOME_Viewer_v0.1.9_ARM64.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.9 >/dev/null 2>&1; then
            gh release upload v0.1.9 ECOHOME_Viewer_v0.1.9_ARM64.apk --clobber
          else
            gh release create v0.1.9 ECOHOME_Viewer_v0.1.9_ARM64.apk --title "ECOHOME Viewer v0.1.9" --notes "Fixes reversed Pan and pinch Zoom directions. Adds green crosshair target inside DIM magnifier for precise point selection."
          fi
