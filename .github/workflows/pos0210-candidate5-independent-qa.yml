name: POS0210 Candidate5 Independent QA

on:
  push:
    branches: [ pos0210-factory ]
    paths:
      - '.github/workflows/pos0210-candidate5-independent-qa.yml'
  workflow_dispatch:

jobs:
  accounting-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdce1f356a6c4a3f4b853a035468770cbf435cda
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run accounting and timer unit tests
        run: |
          gradle -p candidate/POS0210 --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.MonthlyAccountingTest --stacktrace
          gradle -p candidate/POS0210 --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.TableServiceTimerTest --stacktrace
      - name: Candidate5 static assertions
        run: |
          grep -q 'versionCode = 66' candidate/POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate5"' candidate/POS0210/app/build.gradle.kts
          grep -q 'version=13' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'MIGRATION_12_13' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'expenseCategory TEXT NOT NULL DEFAULT' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'CREATE TABLE IF NOT EXISTS MonthlyAccountingEntity' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'CREATE TABLE IF NOT EXISTS ProfitPartnerEntity' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'distributable-allocated' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MonthlyAccounting.kt
          ! grep -R 'fallbackToDestructiveMigration\|deleteDatabase(' candidate/POS0210/app/src/main/java candidate/POS0210/app/src/main/kotlin 2>/dev/null || exit 1
          ! grep -R 'img.vietqr.io' candidate/POS0210/app/src/main || exit 1
          grep -q 'VietQrOffline.bitmap' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt
          grep -q 'firstOrderAt' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt
          grep -q 'lastOrderSentAt' candidate/POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt

  upgrade-data-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            target: google_apis
          - api: 35
            target: aosp_atd
    steps:
      - name: Checkout alpha50 source
        uses: actions/checkout@v4
        with:
          ref: 9ae84b456b25aeb67ea51a2f3b3e8e6dc1e8c105
          path: alpha50
      - name: Checkout exact candidate5
        uses: actions/checkout@v4
        with:
          ref: bdce1f356a6c4a3f4b853a035468770cbf435cda
          path: candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build exact candidate5 and alpha50
        run: |
          gradle -p alpha50/POS0210 --no-daemon :app:assembleDebug --stacktrace
          gradle -p candidate/POS0210 --no-daemon :app:assembleDebug --stacktrace
          cp alpha50/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha50.apk
          cp candidate/POS0210/app/build/outputs/apk/debug/app-debug.apk /tmp/alpha51.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha50.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs /tmp/alpha51.apk
      - name: Patch QA harness expected version only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/.github/scripts/pos0210-upgrade-gate.sh')
          s=p.read_text()
          import re
          s=re.sub(r'versionName=1\.0\.0-alpha52-candidate\d+\|versionCode=\d+', 'versionName=1.0.0-alpha52-candidate5|versionCode=66', s)
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - run: sudo apt-get update -qq && sudo apt-get install -y sqlite3
      - name: Exact candidate5 in-place upgrade/data survival
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash candidate/.github/scripts/pos0210-upgrade-gate.sh
