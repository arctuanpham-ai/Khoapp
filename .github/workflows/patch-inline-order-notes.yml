name: Patch inline order notes

on:
  push:
    branches: [ pos0210-v1-rebuild ]
    paths:
      - '.github/workflows/patch-inline-order-notes.yml'
      - '.github/scripts/patch_inline_order_notes.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: python .github/scripts/patch_inline_order_notes.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt POS0210/app/src/main/java/vn/ecohome/pos0210/PosViewModel.kt
          git diff --cached --quiet || git commit -m "Expose order notes inline for faster service"
          git push
