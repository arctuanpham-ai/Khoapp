name: POS0210 payer tracking candidate15

on:
  push:
    branches:
      - builder/payer-tracking
    paths:
      - .github/workflows/pos0210-payer-update.yml

permissions:
  contents: write

jobs:
  implement_build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: builder/payer-tracking
          fetch-depth: 5

      - name: Verify latest candidate baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 75' POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate14"' POS0210/app/build.gradle.kts
          echo 'Confirmed candidate14 / versionCode 75 baseline.'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: RED payer test
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pos0210_payer_update.py --write-test
          cd POS0210
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.PurchasePayerTrackingTest > /tmp/payer-red.log 2>&1
          code=$?
          set -e
          cat /tmp/payer-red.log
          if [ "$code" -eq 0 ]; then
            echo 'Expected RED test to fail on candidate14, but it passed.' >&2
            exit 1
          fi
          grep -q 'existingPurchaseDefaultsPayerToBlank FAILED' /tmp/payer-red.log

      - name: Apply minimal feature patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pos0210_payer_update.py --apply
          grep -q 'version=18' POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q "ALTER TABLE PurchaseEntity ADD COLUMN paidByName TEXT NOT NULL DEFAULT ''" POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt
          grep -q 'versionCode = 76' POS0210/app/build.gradle.kts
          grep -q 'versionName = "1.0.0-alpha52-candidate15"' POS0210/app/build.gradle.kts

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort
          unexpected=$(git diff --name-only | grep -Ev '^POS0210/app/(build.gradle.kts|src/main/java/vn/ecohome/pos0210/(MainActivity.kt|PosViewModel.kt|cloud/FirebaseCloudSync.kt|data/(Entities.kt|PosDao.kt|PosDatabase.kt))|src/test/java/vn/ecohome/pos0210/PurchasePayerTrackingTest.kt)$' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected source files changed:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: GREEN targeted test and build
        shell: bash
        working-directory: POS0210
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests vn.ecohome.pos0210.PurchasePayerTrackingTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify APK
        shell: bash
        working-directory: POS0210
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          BADGING=$($AAPT dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='vn.ecohome.pos0210'"
          echo "$BADGING" | grep -q "versionCode='76'"
          echo "$BADGING" | grep -q "versionName='1.0.0-alpha52-candidate15'"
          $APKSIGNER verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/POS0210_v1.0.0-alpha52-candidate15.apk
          sha256sum dist/POS0210_v1.0.0-alpha52-candidate15.apk | tee dist/POS0210_v1.0.0-alpha52-candidate15.apk.sha256

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'POS0210 Builder'
          git config user.email 'actions@github.com'
          git add \
            POS0210/app/build.gradle.kts \
            POS0210/app/src/main/java/vn/ecohome/pos0210/MainActivity.kt \
            POS0210/app/src/main/java/vn/ecohome/pos0210/PosViewModel.kt \
            POS0210/app/src/main/java/vn/ecohome/pos0210/cloud/FirebaseCloudSync.kt \
            POS0210/app/src/main/java/vn/ecohome/pos0210/data/Entities.kt \
            POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDao.kt \
            POS0210/app/src/main/java/vn/ecohome/pos0210/data/PosDatabase.kt \
            POS0210/app/src/test/java/vn/ecohome/pos0210/PurchasePayerTrackingTest.kt
          git diff --cached --check
          git commit -m 'feat(pos0210): track actual payer on expenses [skip ci]'
          git push origin HEAD:builder/payer-tracking
          git rev-parse HEAD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS0210-v1.0.0-alpha52-candidate15-vc76
          path: |
            POS0210/dist/POS0210_v1.0.0-alpha52-candidate15.apk
            POS0210/dist/POS0210_v1.0.0-alpha52-candidate15.apk.sha256
          if-no-files-found: error
          retention-days: 30