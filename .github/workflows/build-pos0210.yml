name: Build POS0210 APK

on:
  push:
    branches: [ pos0210-v1-rebuild ]
    paths:
      - 'POS0210/**'
      - '.github/workflows/build-pos0210.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: POS0210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk POS0210_v1.0.0-alpha23.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS0210-v1.0.0-alpha23
          path: POS0210/POS0210_v1.0.0-alpha23.apk
