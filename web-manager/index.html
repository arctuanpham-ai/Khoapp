<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f6f0e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>0210 · Manager</title>
  </head>
  <body>
    <main class="shell">
      <section id="login-view" class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">0210 · BREAKFAST · COFFEE · DRINKS</p>
        <h1 id="login-title">Manager realtime</h1>
        <p class="muted">Chỉ xem tình trạng quán. Không thể tạo hoặc sửa dữ liệu bán hàng.</p>
        <label>Email Firebase<input id="email" type="email" autocomplete="username" inputmode="email" /></label>
        <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" /></label>
        <button id="login-button" class="primary">Đăng nhập</button>
        <p id="login-error" class="error" role="alert"></p>
      </section>

      <section id="dashboard-view" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">0210 · MANAGER</p>
            <h1>Tình hình quán</h1>
          </div>
          <button id="logout-button" class="text-button">Đăng xuất</button>
        </header>

        <p id="sync-status" class="sync-status">Đang kết nối realtime…</p>
        <section id="summary" class="summary-grid" aria-label="Tổng quan realtime"></section>
        <section class="section-heading"><div><p class="eyebrow">SƠ ĐỒ BÀN</p><h2>Trạng thái phục vụ</h2></div></section>
        <section id="tables" class="table-grid" aria-live="polite"></section>
      </section>
    </main>

    <dialog id="table-detail">
      <article>
        <div class="dialog-header"><div><p class="eyebrow">CHI TIẾT BÀN</p><h2 id="detail-title"></h2></div><button id="close-detail" class="text-button">Đóng</button></div>
        <p id="detail-meta" class="muted"></p>
        <ul id="detail-items" class="order-list"></ul>
        <footer id="detail-total" class="detail-total"></footer>
      </article>
    </dialog>

    <template id="metric-template"><article class="metric"><p></p><strong></strong></article></template>
    <template id="table-template"><button class="table-card"><span class="table-state"></span><strong></strong><small></small><b></b></button></template>
    <script type="module" src="app.js"></script>
  </body>
</html>
